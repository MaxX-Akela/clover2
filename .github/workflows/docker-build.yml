name: Docker Build and Push

on:
  push:
    tags: ['v*']
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-mode:
    if: github.event.pull_request.draft == false
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    outputs:
      build_mode: ${{ steps.version.outputs.build_mode }}
      git_hash: ${{ steps.version.outputs.git_hash }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/version-detect
        id: version

  docker:
    needs: detect-mode
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: clover2-tooling
          - target: clover2-docs
          - target: clover2-frontend
          - target: ros,ros-test
            cache-scope: ros
    env:
      BUILD_MODE: ${{ needs.detect-mode.outputs.build_mode }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-bake
        with:
          target: ${{ matrix.target }}
          build-mode: ${{ needs.detect-mode.outputs.build_mode }}
          git-hash: ${{ needs.detect-mode.outputs.git_hash }}
          version: ${{ needs.detect-mode.outputs.version }}
          cache-scope: ${{ matrix.cache-scope }}
          push: ${{ github.event_name != 'pull_request' }}

      - name: Check test results
        if: ${{ always() && matrix.cache-scope == 'ros' }}
        run: test ! -f test-results/FAILED

      - name: Upload test results
        if: ${{ always() && matrix.cache-scope == 'ros' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          if-no-files-found: warn

  rpi-release-asset:
    needs: [detect-mode, docker]
    if: ${{ needs.detect-mode.outputs.build_mode == 'release' || needs.detect-mode.outputs.build_mode == 'pre-release' }}
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      packages: read
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/clover2/clover2-ros:${{ needs.detect-mode.outputs.version }}
      ASSET: clover2-ros-rpi4-5-arm64-${{ needs.detect-mode.outputs.version }}.tar.gz
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-setup
        with:
          ghcr-token: ${{ github.token }}

      - name: Export clover2-ros image for Raspberry Pi 4/5 (arm64)
        run: |
          docker pull --platform linux/arm64 "$IMAGE"
          docker save "$IMAGE" | gzip > "$ASSET"

      - name: Attach image to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.detect-mode.outputs.version }}
          files: ${{ env.ASSET }}
          fail_on_unmatched_files: true
